services:
  app:
    build: . #path to look foe the docker file
    container_name: closet-match
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/closetmatch
      - JWT_SECRET=your_jwt_secret
      - NODE_ENV=development
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
  db:
    image: postgres:13-alpine
    container_name: closet-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=closetmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closetmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
